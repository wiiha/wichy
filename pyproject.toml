[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wichy"
version = "0.2.0"
description = "Agentic LLM for coding."
readme = "README.md"
authors = [
    {name = "Wilhelm Hansson", email = "wilhelm.hansson@pm.me" }
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.10"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.11.0",
    "beautifulsoup4==4.14.3",
    "brotli==1.2.0",
    "certifi==2025.10.5",
    "click==8.3.1",
    "ddgs==9.9.1",
    "distro==1.9.0",
    "exceptiongroup==1.3.0",
    "fake-useragent==2.2.0",
    "Flask==3.0.3",
    "greenlet==3.2.4",
    "h11==0.16.0",
    "h2==4.3.0",
    "hpack==4.1.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "hyperframe==6.1.0",
    "idna==3.11",
    "jiter==0.12.0",
    "lxml==6.0.2",
    "markdown-it-py==3.0.0",
    "markdownify==1.2.2",
    "mdurl==0.1.2",
    "openai==2.7.2",
    "pathspec==0.12.1",
    "patch-ng==1.19.0",
    "playwright==1.56.0",
    "primp==0.15.0",
    "pydantic==2.12.4",
    "pydantic_core==2.41.5",
    "pyee==13.0.0",
    "Pygments==2.19.2",
    "prompt-toolkit==3.0.52",
    "python-dotenv==1.2.1",
    "rich==14.2.0",
    "six==1.17.0",
    "sniffio==1.3.1",
    "socksio==1.0.0",
    "soupsieve==2.8",
    "tqdm==4.67.1",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
]

[project.scripts]
wichy = "wichy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
