<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wichy Chat</title>
    <link rel="stylesheet" href="/shared/shared.css">
    <script src="/shared/marked.min.js"></script>
    <style>
        body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
        .header { padding: 1rem; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }
        .messages { flex: 1; overflow-y: auto; padding: 1rem; }
        .message { padding: 0.5rem; margin: 0.25rem 0; border-radius: 4px; }
        .user { background: #bbdefb; margin-left: auto; width: fit-content; max-width: 80%; }
        .assistant { background: #f5f5f5; margin-right: auto; width: fit-content; max-width: 80%; }
        .assistant code { background: #e0e0e0; padding: 0.1em 0.3em; border-radius: 3px; font-family: monospace; }
        .assistant pre { background: #e8e8e8; padding: 0.75rem; border-radius: 4px; overflow-x: auto; }
        .assistant pre code { background: none; padding: 0; }
        .assistant blockquote { border-left: 3px solid #ccc; margin: 0.5rem 0; padding-left: 0.75rem; color: #555; }
        .assistant ul, .assistant ol { margin: 0.5rem 0; padding-left: 1.5rem; }
        .assistant h1, .assistant h2, .assistant h3, .assistant h4 { margin: 0.75rem 0 0.25rem; }
        .system { color: #888; font-size: 0.85em; text-align: center; background: transparent; font-family: monospace; }
        .verification { border: 1px solid #f0ad4e; background: #fff8e1; padding: 1rem; margin: 0.5rem 0; border-radius: 6px; font-family: sans-serif; }
        .verification .ver-label { font-weight: bold; margin-bottom: 0.5rem; }
        .verification .ver-msg { color: #333; margin-bottom: 0.5rem; }
        .verification .ver-buttons { display: flex; gap: 0.5rem; }
        .verification button { cursor: pointer; }
        .verification .approved { border: 1px solid #4caf50; background: #e8f5e9; }
        .verification .denied { border: 1px solid #f44336; background: #ffebee; }
        .question { border: 1px solid #2196f3; background: #e3f2fd; padding: 1rem; margin: 0.5rem 0; border-radius: 6px; font-family: sans-serif; }
        .question .q-header { font-weight: bold; margin-bottom: 0.5rem; }
        .question .q-text { color: #333; margin-bottom: 0.5rem; }
        .question .q-options { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.5rem; }
        .question .q-options label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .question button { cursor: pointer; }
        .question .answered { border: 1px solid #4caf50; background: #e8f5e9; }
        .input-bar { padding: 1rem; border-top: 1px solid #ccc; display: flex; gap: 0.5rem; }
        textarea { flex: 1; padding: 0.5rem; font-family: monospace; }
        button { padding: 0.5rem 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Wichy Chat</h1>
        <span id="status">?</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
        <textarea id="input" rows="2" placeholder="Type message..."></textarea>
        <button id="send">Send</button>
    </div>
    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const status = document.getElementById('status');
        let renderedIds = new Set();

        async function load() {
            const resp = await fetch('/chat/api/history');
            const data = await resp.json();
            let changed = false;
            for (const e of data) {
                if (renderedIds.has(e.id)) continue;
                renderedIds.add(e.id);
                changed = true;
                const div = renderEntry(e);
                messages.appendChild(div);
            }
            if (changed) messages.scrollTop = messages.scrollHeight;
        }

        function renderEntry(e) {
            if (e.type === 'verification') {
                return renderVerification(e);
            }
            if (e.type === 'question') {
                return renderQuestion(e);
            }
            const div = document.createElement('div');
            div.className = 'message ' + (e.role || 'assistant');
            if ((e.role === 'assistant' || e.role === 'user') && window.marked) {
                div.innerHTML = window.marked.parse(e.content || '', { breaks: true, sanitize: false });
            } else {
                div.textContent = e.content || '';
            }
            return div;
        }

        function renderVerification(e) {
            const v = e.metadata?.verification || {};
            const container = document.createElement('div');
            container.className = 'message verification';
            container.dataset.vid = v.id || '';

            if (v.resolved) {
                container.classList.add(v.approved ? 'approved' : 'denied');
                container.textContent = v.approved ? 'Approved' : 'Denied';
                return container;
            }

            const label = document.createElement('div');
            label.className = 'ver-label';
            label.textContent = v.label || 'Action requested';
            container.appendChild(label);

            if (v.message) {
                const msg = document.createElement('div');
                msg.className = 'ver-msg';
                msg.textContent = v.message;
                container.appendChild(msg);
            }

            if (v.args) {
                const args = document.createElement('pre');
                args.textContent = v.args;
                container.appendChild(args);
            }

            const btns = document.createElement('div');
            btns.className = 'ver-buttons';

            const approve = document.createElement('button');
            approve.textContent = 'Approve';
            approve.onclick = () => resolveVerification(v.id, true, container);
            btns.appendChild(approve);

            const deny = document.createElement('button');
            deny.textContent = 'Deny';
            deny.onclick = () => resolveVerification(v.id, false, container);
            btns.appendChild(deny);

            container.appendChild(btns);
            return container;
        }

        async function resolveVerification(vid, approved, container) {
            await fetch(`/chat/api/verifications/${vid}/resolve`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ approved: approved })
            });
            container.classList.add(approved ? 'approved' : 'denied');
            container.innerHTML = '';
            container.textContent = approved ? 'Approved' : 'Denied';
        }

        function renderQuestion(e) {
            const g = e.metadata?.group || {};
            const qid = g.id || '';
            const questions = g.questions || [];
            const container = document.createElement('div');
            container.className = 'message question';
            container.dataset.qid = qid;

            if (g.answered) {
                container.classList.add('answered');
                container.textContent = 'Answered';
                return container;
            }

            for (const q of questions) {
                const header = document.createElement('div');
                header.className = 'q-header';
                header.textContent = q.header || '';
                container.appendChild(header);

                if (q.question) {
                    const text = document.createElement('div');
                    text.className = 'q-text';
                    text.textContent = q.question;
                    container.appendChild(text);
                }

                const opts = document.createElement('div');
                opts.className = 'q-options';
                const inputType = q.multiSelect ? 'checkbox' : 'radio';
                const groupName = `q_${qid}_${q.header || 'q'}`;

                // Auto-add "Other (please specify)" if not already present
                const otherLabel = 'Other (please specify)';
                let hasOther = false;
                for (const opt of (q.options || [])) {
                    if ((opt.label || '').toLowerCase().trim() === 'other') {
                        hasOther = true;
                    }
                }

                for (const opt of (q.options || [])) {
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = inputType;
                    input.name = groupName;
                    input.value = opt.label || '';
                    label.appendChild(input);
                    const span = document.createElement('span');
                    span.textContent = opt.description || opt.label || '';
                    label.appendChild(span);
                    opts.appendChild(label);
                }

                if (!hasOther) {
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = inputType;
                    input.name = groupName;
                    input.value = otherLabel;
                    label.appendChild(input);
                    const span = document.createElement('span');
                    span.textContent = otherLabel;
                    label.appendChild(span);
                    opts.appendChild(label);
                }
                container.appendChild(opts);
            }

            const submit = document.createElement('button');
            submit.textContent = 'Submit';
            submit.onclick = () => submitAnswer(qid, questions, container);
            container.appendChild(submit);

            return container;
        }

        async function submitAnswer(qid, questions, container) {
            const answers = {};
            for (const q of questions) {
                const groupName = `q_${qid}_${q.header || 'q'}`;
                const inputs = container.querySelectorAll(`input[name="${groupName}"]:checked`);
                let vals = Array.from(inputs).map(i => i.value);
                const otherIdx = vals.indexOf('Other (please specify)');

                if (otherIdx !== -1) {
                    if (q.multiSelect) {
                        // Strip 'Other' from multi-select (REPL behavior)
                        vals.splice(otherIdx, 1);
                        answers[q.header || 'answer'] = vals.join(', ') || 'No selection';
                    } else {
                        // Single-select: prompt for custom text
                        const custom = window.prompt(`You selected 'Other' for '${q.question}'. Please specify:`);
                        answers[q.header || 'answer'] = custom || 'No selection';
                    }
                } else {
                    if (q.multiSelect) {
                        answers[q.header || 'answer'] = vals.join(', ') || 'No selection';
                    } else {
                        answers[q.header || 'answer'] = vals[0] || 'No selection';
                    }
                }
            }

            await fetch(`/chat/api/questions/${qid}/answer`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers: answers })
            });
            container.classList.add('answered');
            container.innerHTML = '';
            container.textContent = 'Answered';
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            await fetch('/chat/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: text })
            });
            await load();
        }

        sendBtn.onclick = send;
        input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

        async function pollStatus() {
            try {
                const resp = await fetch('/chat/api/status');
                const data = await resp.json();
                status.textContent = data.connected ? 'connected' : 'disconnected';
            } catch (e) {
                status.textContent = 'error';
            }
        }

        load();
        setInterval(load, 500);
        setInterval(pollStatus, 2000);
    </script>
</body>
</html>
