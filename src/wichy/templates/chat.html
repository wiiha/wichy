<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wichy Chat</title>
    <link rel="stylesheet" href="/shared/shared.css">
    <style>
        body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
        .header { padding: 1rem; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }
        .messages { flex: 1; overflow-y: auto; padding: 1rem; }
        .message { padding: 0.5rem; margin: 0.25rem 0; border-radius: 4px; white-space: pre-wrap; font-family: monospace; }
        .user { background: #e3f2fd; text-align: right; }
        .assistant { background: #f5f5f5; }
        .input-bar { padding: 1rem; border-top: 1px solid #ccc; display: flex; gap: 0.5rem; }
        textarea { flex: 1; padding: 0.5rem; font-family: monospace; }
        button { padding: 0.5rem 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Wichy Chat</h1>
        <span id="status">?</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
        <textarea id="input" rows="2" placeholder="Type message..."></textarea>
        <button id="send">Send</button>
    </div>
    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const status = document.getElementById('status');
        let lastLen = 0;

        async function load() {
            const resp = await fetch('/chat/api/history');
            const data = await resp.json();
            if (data.length !== lastLen) {
                messages.innerHTML = '';
                for (const e of data) {
                    const div = document.createElement('div');
                    div.className = 'message ' + (e.role || 'assistant');
                    div.textContent = e.content || '';
                    messages.appendChild(div);
                }
                lastLen = data.length;
                messages.scrollTop = messages.scrollHeight;
            }
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            await fetch('/chat/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: text })
            });
            await load();
        }

        sendBtn.onclick = send;
        input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

        async function pollStatus() {
            try {
                const resp = await fetch('/chat/api/status');
                const data = await resp.json();
                status.textContent = data.connected ? 'connected' : 'disconnected';
            } catch (e) {
                status.textContent = 'error';
            }
        }

        load();
        setInterval(load, 500);
        setInterval(pollStatus, 2000);
    </script>
</body>
</html>
