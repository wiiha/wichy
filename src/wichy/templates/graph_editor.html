<!doctype html>
<html>
  <head>
    <title>Graph Editor</title>
    <script
      type="text/javascript"
      src="/tools/graph/static/vis-network.min.js"
    ></script>
    <link
      href="/tools/graph/static/vis-network.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="/shared/shared.css">
    <style>
      /* Graph Editor specific styles */
      body {
        padding: var(--space-md);
      }

      #header {
        background: var(--surface);
        padding: var(--space-md) var(--space-lg);
        border-radius: var(--radius-md);
        margin-bottom: var(--space-md);
        box-shadow: var(--shadow-sm);
      }

      #header h1 {
        margin: 0;
        font-size: var(--font-size-xl);
        color: var(--text);
      }

      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-md);
      }

      .header-nav a {
        color: var(--primary-500);
        text-decoration: none;
        font-size: var(--font-size-sm);
        transition: color var(--transition-fast);
      }

      .header-nav a:hover {
        color: var(--primary-700);
      }

      #controls {
        display: flex;
        gap: var(--space-md);
        align-items: center;
        flex-wrap: wrap;
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
      }

      .control-group label {
        font-size: var(--font-size-sm);
        color: var(--text-muted);
      }

      .control-group input[type="range"] {
        width: 100px;
      }

      .control-group input[type="number"] {
        width: 60px;
        padding: var(--space-xs) var(--space-sm);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-size: var(--font-size-sm);
      }

      #graph-selector {
        padding: var(--space-sm) var(--space-md);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: var(--font-size-base);
        min-width: 200px;
      }

      #refresh-btn {
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: var(--space-sm) var(--space-md);
        cursor: pointer;
        font-size: 1rem;
      }

      #refresh-btn:hover {
        background: var(--background-alt);
      }

      #save-btn {
        background: var(--success);
        color: white;
        border: none;
        padding: var(--space-sm) var(--space-lg);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: var(--font-size-base);
      }

      #save-btn:hover {
        background: #15803d;
      }

      #save-btn:disabled {
        background: var(--text-light);
        cursor: not-allowed;
      }

      #status {
        margin-left: var(--space-md);
        font-size: var(--font-size-base);
        color: var(--text-muted);
      }

      #network-container {
        background: var(--surface);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      #export-btn {
        background: var(--background);
        border: 1px solid var(--border);
        padding: var(--space-sm) var(--space-lg);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: var(--font-size-base);
      }

      #export-btn:hover {
        background: var(--background-alt);
      }

      #search-input {
        width: 200px;
        padding: var(--space-sm) var(--space-md);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: var(--font-size-base);
      }

      #search-input:focus {
        border-color: var(--primary-500);
        outline: none;
      }

      #network {
        width: 100%;
        height: 70vh;
        border: 1px solid var(--border);
      }

      .vis-manipulation {
        background: var(--background) !important;
        border-bottom: 1px solid var(--border) !important;
      }

      /* Modal dialog styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10000;
      }

      .modal-dialog {
        background: var(--surface);
        padding: var(--space-2xl);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-xl);
        min-width: 300px;
      }

      .modal-dialog h3 {
        margin: 0 0 var(--space-lg) 0;
        color: var(--text);
      }

      .modal-dialog label {
        display: block;
        margin-bottom: var(--space-sm);
        font-weight: 500;
        color: var(--text-muted);
      }

      .modal-dialog input[type="text"] {
        width: 100%;
        padding: var(--space-sm);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        margin-bottom: var(--space-lg);
        font-size: var(--font-size-base);
        box-sizing: border-box;
      }

      .modal-dialog input[type="color"] {
        width: 60px;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        cursor: pointer;
        margin-bottom: var(--space-lg);
      }

      .modal-buttons {
        display: flex;
        gap: var(--space-md);
        justify-content: flex-end;
      }

      .modal-buttons button {
        padding: var(--space-sm) var(--space-lg);
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: var(--font-size-base);
      }

      .modal-buttons .btn-cancel {
        background: var(--background);
        color: var(--text);
      }

      .modal-buttons .btn-cancel:hover {
        background: var(--background-alt);
      }

      .modal-buttons .btn-save {
        background: var(--success);
        color: white;
      }

      .modal-buttons .btn-save:hover {
        background: #15803d;
      }

      .color-preview {
        display: inline-block;
        width: 30px;
        height: 20px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        vertical-align: middle;
        margin-left: var(--space-sm);
      }
    </style>
  </head>
  <body>
    <div id="header">
      <div class="header-row">
        <h1>Graph Editor</h1>
        <nav class="header-nav">
          <a href="/">Back to Home</a>
        </nav>
      </div>
      <div id="controls">
        <select id="graph-selector" onchange="loadSelectedGraph()">
          <option value="">-- New Graph --</option>
        </select>
        <button
          id="refresh-btn"
          onclick="loadGraphList()"
          title="Refresh graph list"
        >
          ↻
        </button>
        <button id="save-btn" onclick="saveGraph()">Save Graph</button>
        <button id="export-btn" onclick="exportPNG()">Export PNG</button>
        <span id="search-wrap" style="position:relative; display:inline-block;">
          <input
            type="text"
            id="search-input"
            placeholder="Search nodes and edges..."
            oninput="debouncedSearch(this.value)"
            onkeydown="if(event.key==='Escape'){this.value='';debouncedSearch('');}"
          />
          <button onclick="var el=document.getElementById('search-input'); el.value=''; debouncedSearch(''); el.focus();"
                  title="Clear search"
                  style="position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:0 6px;">×</button>
        </span>
        <div class="control-group">
          <label
            for="repulsion"
            title="More negative = nodes repel each other more"
            >Repulsion:</label
          >
          <input
            type="range"
            id="repulsion"
            min="-500"
            max="-10"
            step="10"
            value="-80"
            onchange="updatePhysics()"
          />
          <input
            type="number"
            id="repulsion-value"
            min="-500"
            max="-10"
            step="10"
            value="-80"
            onchange="updatePhysicsFromNumber()"
          />
        </div>
        <span id="status"></span>
      </div>
    </div>
    <div id="network-container">
      <div id="network"></div>
    </div>

    <script type="text/javascript">
      // Create DataSets
      var nodes = new vis.DataSet([]);
      var edges = new vis.DataSet([]);

      // Default node colors
      var defaultColors = [
        "#97C2FC",
        "#FB7E81",
        "#7BE141",
        "#FFA80B",
        "#AD85E4",
        "#6C6C6C",
        "#FFC470",
        "#2B7CE9",
      ];
      var defaultColorIndex = 0;

      function getNextDefaultColor() {
        var color = defaultColors[defaultColorIndex % defaultColors.length];
        defaultColorIndex++;
        return color;
      }

      // Modal dialog functions
      var modalCallback = null;

      function showModal(title, fields, callback) {
        modalCallback = callback;

        // Create modal overlay
        var overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.id = "modal-overlay";

        // Create modal dialog
        var dialog = document.createElement("div");
        dialog.className = "modal-dialog";

        // Title
        var h3 = document.createElement("h3");
        h3.textContent = title;
        dialog.appendChild(h3);

        // Fields
        fields.forEach(function (field) {
          var label = document.createElement("label");
          label.textContent = field.label;
          dialog.appendChild(label);

          var input;
          if (field.type === "color") {
            input = document.createElement("input");
            input.type = "color";
            input.id = "modal-" + field.id;
            input.value = field.value || "#97C2FC";
            dialog.appendChild(input);

            // Add color preview
            var preview = document.createElement("span");
            preview.className = "color-preview";
            preview.style.background = input.value;
            preview.id = "modal-preview-" + field.id;
            dialog.appendChild(preview);

            // Update preview on change
            input.addEventListener("input", function () {
              document.getElementById(
                "modal-preview-" + field.id,
              ).style.background = this.value;
            });

            dialog.appendChild(document.createElement("br"));
          } else {
            input = document.createElement("input");
            input.type = "text";
            input.id = "modal-" + field.id;
            input.value = field.value || "";
            input.placeholder = field.placeholder || "";
            dialog.appendChild(input);
          }
        });

        // Buttons
        var buttons = document.createElement("div");
        buttons.className = "modal-buttons";

        var cancelBtn = document.createElement("button");
        cancelBtn.className = "btn-cancel";
        cancelBtn.textContent = "Cancel";
        cancelBtn.onclick = function () {
          document.body.removeChild(overlay);
          if (modalCallback) modalCallback(null, true);
        };

        var saveBtn = document.createElement("button");
        saveBtn.className = "btn-save";
        saveBtn.textContent = "Save";
        saveBtn.onclick = function () {
          var result = {};
          fields.forEach(function (field) {
            var input = document.getElementById("modal-" + field.id);
            result[field.id] = input.value;
          });
          document.body.removeChild(overlay);
          if (modalCallback) modalCallback(result);
        };

        buttons.appendChild(cancelBtn);
        buttons.appendChild(saveBtn);
        dialog.appendChild(buttons);

        overlay.appendChild(dialog);
        document.body.appendChild(overlay);

        // Focus first text input
        var firstInput = dialog.querySelector('input[type="text"]');
        if (firstInput) {
          firstInput.focus();
        }
      }

      // Configure network options
      var options = {
        interaction: {
          hover: true,
          tooltipDelay: 200,
          zoomView: true,
          dragView: true,
          selectConnectedEdges: true,
          multiselect: true,
          navigationButtons: true,
        },
        physics: {
          enabled: true,
          solver: "forceAtlas2Based",
          forceAtlas2Based: {
            gravitationalConstant: -80,
            centralGravity: 0.01,
            springLength: 200,
            springConstant: 0.05,
            avoidOverlap: 0.8,
          },
          stabilization: {
            iterations: 150,
            fit: true,
          },
        },
        nodes: {
          shape: "dot",
          size: 25,
          font: {
            size: 14,
            color: "#333333",
          },
          borderWidth: 2,
          shadow: true,
          color: {
            background: "#97C2FC",
            border: "#2B7CE9",
            highlight: {
              background: "#D2E5FF",
              border: "#2B7CE9",
            },
          },
        },
        edges: {
          width: 2,
          color: {
            color: "#848484",
            highlight: "#FFA500",
            hover: "#848484",
          },
          arrows: {
            to: {
              enabled: true,
              scaleFactor: 1,
            },
          },
          smooth: {
            type: "continuous",
            roundness: 0.5,
          },
          font: {
            size: 12,
            align: "middle",
          },
        },
        manipulation: {
          enabled: true,
          initiallyActive: false,

          addNode: function (data, callback) {
            var color = getNextDefaultColor();
            showModal(
              "Add Node",
              [
                {
                  id: "label",
                  label: "Node Label:",
                  value: "",
                  placeholder: "Enter node label",
                },
                {
                  id: "color",
                  label: "Node Color:",
                  value: color,
                  type: "color",
                },
              ],
              function (result, cancelled) {
                if (cancelled) {
                  callback(null);
                } else if (result) {
                  data.label = result.label || "Node";
                  data.color = result.color;
                  callback(data);
                }
              },
            );
          },

          editNode: function (data, callback) {
            var currentColor = data.color;
            if (typeof currentColor === "object") {
              currentColor = currentColor.background || "#97C2FC";
            }
            showModal(
              "Edit Node",
              [
                { id: "label", label: "Node Label:", value: data.label || "" },
                {
                  id: "color",
                  label: "Node Color:",
                  value: currentColor,
                  type: "color",
                },
              ],
              function (result, cancelled) {
                if (cancelled) {
                  callback(null);
                } else if (result) {
                  data.label = result.label || "Node";
                  data.color = result.color;
                  callback(data);
                }
              },
            );
          },

          addEdge: function (data, callback) {
            showModal(
              "Add Edge",
              [
                {
                  id: "label",
                  label: "Edge Label:",
                  value: "",
                  placeholder: "Enter edge label (optional)",
                },
              ],
              function (result, cancelled) {
                if (cancelled) {
                  callback(null);
                } else if (result) {
                  data.label = result.label || "";
                  data.arrows = { to: { enabled: true } };
                  callback(data);
                }
              },
            );
          },

          editEdge: function (data, callback) {
            // Find current edge to get its label
            var currentEdge = edges.get(data.id);
            var currentLabel = currentEdge ? currentEdge.label || "" : "";

            showModal(
              "Edit Edge",
              [
                {
                  id: "label",
                  label: "Edge Label:",
                  value: currentLabel,
                  placeholder: "Enter edge label (optional)",
                },
              ],
              function (result, cancelled) {
                if (cancelled) {
                  callback(null);
                } else if (result) {
                  data.label = result.label || "";
                  callback(data);
                }
              },
            );
          },

          deleteNode: function (data, callback) {
            callback(data);
          },

          deleteEdge: function (data, callback) {
            callback(data);
          },
        },
      };

      // Initialize network
      var container = document.getElementById("network");
      var data = { nodes: nodes, edges: edges };
      var network = new vis.Network(container, data, options);

      // Physics controls
      function updatePhysics() {
        var repulsion = parseInt(
          document.getElementById("repulsion").value,
        );
        document.getElementById("repulsion-value").value = repulsion;
        network.setOptions({
          physics: {
            forceAtlas2Based: {
              gravitationalConstant: repulsion,
            },
          },
        });
      }

      function updatePhysicsFromNumber() {
        var repulsion = parseInt(
          document.getElementById("repulsion-value").value,
        );
        // Clamp value
        repulsion = Math.max(-500, Math.min(-10, repulsion));
        document.getElementById("repulsion-value").value = repulsion;
        document.getElementById("repulsion").value = repulsion;
        network.setOptions({
          physics: {
            forceAtlas2Based: {
              gravitationalConstant: repulsion,
            },
          },
        });
      }

      // Status feedback
      var statusEl = document.getElementById("status");
      var saveBtn = document.getElementById("save-btn");
      var graphSelector = document.getElementById("graph-selector");
      var currentGraphFile = null;

      // Load graph list on startup
      function loadGraphList() {
        fetch("/tools/graph/api/list")
          .then((response) => response.json())
          .then((data) => {
            graphSelector.innerHTML =
              '<option value="">-- New Graph --</option>';
            data.graphs.forEach(function (g) {
              var option = document.createElement("option");
              option.value = g.filename;
              var date = new Date(g.modified * 1000);
              var dateStr =
                date.toLocaleDateString() +
                " " +
                date.toLocaleTimeString([], {
                  hour: "2-digit",
                  minute: "2-digit",
                });
              option.textContent = g.filename + " (" + dateStr + ")";
              graphSelector.appendChild(option);
            });
            // Select latest.json if it exists
            var hasLatest = data.graphs.some(
              (g) => g.filename === "latest.json",
            );
            if (hasLatest) {
              graphSelector.value = "latest.json";
              loadSelectedGraph();
            }
          })
          .catch((err) => console.error("Failed to load graph list:", err));
      }

      function loadSelectedGraph() {
        var filename = graphSelector.value;
        if (!filename) {
          // New graph - clear existing
          nodes.clear();
          edges.clear();
          currentGraphFile = null;
          statusEl.textContent = "New graph";
          return;
        }

        statusEl.textContent = "Loading...";
        fetch("/tools/graph/api/load/" + encodeURIComponent(filename))
          .then((response) => response.json())
          .then((data) => {
            if (data.error) {
              statusEl.textContent = "Error: " + data.error;
              return;
            }
            nodes.clear();
            edges.clear();
            if (data.nodes) nodes.add(data.nodes);
            if (data.edges) edges.add(data.edges);
            currentGraphFile = filename;
            statusEl.textContent = "Loaded " + filename;
            setTimeout(function () {
              statusEl.textContent = "";
            }, 2000);
          })
          .catch((err) => {
            statusEl.textContent = "Error loading: " + err.message;
          });
      }

      // Load graph list on page load
      loadGraphList();

      network.on("stabilizationIterationsDone", function () {
        console.log("Stabilization complete");
      });

      // Save function
      function saveGraph() {
        saveBtn.disabled = true;
        statusEl.textContent = "Saving...";

        var graphData = {
          nodes: nodes.get(),
          edges: edges.get(),
        };

        fetch("/tools/graph/api/save", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(graphData),
        })
          .then((response) => response.json())
          .then((data) => {
            saveBtn.disabled = false;
            if (data.status === "ok") {
              statusEl.textContent = "Saved! " + data.file;
              setTimeout(function () {
                statusEl.textContent = "";
              }, 3000);
            } else {
              statusEl.textContent = "Error: " + data.message;
            }
          })
          .catch((err) => {
            statusEl.textContent = "Error: " + err.message;
            saveBtn.disabled = false;
          });
      }

      // Auto-save indicator
      var autoSaveTimeout;
      network.on("addNode", function () {
        clearTimeout(autoSaveTimeout);
        statusEl.textContent = "Modified (unsaved)";
      });
      network.on("removeNode", function () {
        clearTimeout(autoSaveTimeout);
        statusEl.textContent = "Modified (unsaved)";
      });
      network.on("addEdge", function () {
        clearTimeout(autoSaveTimeout);
        statusEl.textContent = "Modified (unsaved)";
      });
      network.on("removeEdge", function () {
        clearTimeout(autoSaveTimeout);
        statusEl.textContent = "Modified (unsaved)";
      });

      // ---- Search Feature ----
      var searchTimeout = null;
      var statusClearTimeout = null;
      var nodeDefaults = options.nodes || {};
      var defaultFontColor = (nodeDefaults.font && nodeDefaults.font.color) ? nodeDefaults.font.color : "#333333";

      function debouncedSearch(query) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function () {
          doSearch(query);
        }, 200);
      }

      function doSearch(query) {
        clearTimeout(searchTimeout);
        query = (query || "").toLowerCase().trim();

        if (!query) {
          resetSearch();
          return;
        }

        var allNodes = nodes.get({ returnType: "Array" });
        var allEdges = edges.get({ returnType: "Array" });
        var matchingNodeIds = new Set();
        var matchingEdgeIds = new Set();

        // Find matching nodes
        allNodes.forEach(function (node) {
          var label = (node.label || "").toLowerCase();
          var id = (node.id != null ? String(node.id) : "").toLowerCase();
          if (label.indexOf(query) !== -1 || id.indexOf(query) !== -1) {
            matchingNodeIds.add(node.id);
          }
        });

        // Find matching edges AND highlight connected nodes
        allEdges.forEach(function (edge) {
          var edgeLabel = (edge.label || "").toLowerCase();
          if (edgeLabel.indexOf(query) !== -1) {
            matchingEdgeIds.add(edge.id);
            matchingNodeIds.add(edge.from);
            matchingNodeIds.add(edge.to);
          }
        });

        // Update nodes
        var nodeUpdates = [];
        allNodes.forEach(function (node) {
          if (matchingNodeIds.has(node.id)) {
            nodeUpdates.push({
              id: node.id,
              opacity: 1,
              font: { color: defaultFontColor }
            });
          } else {
            nodeUpdates.push({
              id: node.id,
              opacity: 0.15,
              font: { color: "transparent" }
            });
          }
        });
        nodes.update(nodeUpdates);

        // Update edges
        var edgeUpdates = [];
        allEdges.forEach(function (edge) {
          if (matchingEdgeIds.has(edge.id)) {
            edgeUpdates.push({ id: edge.id, color: { opacity: 1 }, font: { color: defaultFontColor } });
          } else {
            edgeUpdates.push({ id: edge.id, color: { opacity: 0.05 }, font: { color: "transparent" } });
          }
        });
        edges.update(edgeUpdates);
      }

      function resetSearch() {
        clearTimeout(searchTimeout);

        var allNodes = nodes.get({ returnType: "Array" });
        var allEdges = edges.get({ returnType: "Array" });

        var nodeUpdates = [];
        allNodes.forEach(function (node) {
          nodeUpdates.push({
            id: node.id,
            opacity: 1,
            font: { color: defaultFontColor }
          });
        });
        nodes.update(nodeUpdates);

        var edgeUpdates = [];
        allEdges.forEach(function (edge) {
          edgeUpdates.push({ id: edge.id, color: { opacity: 1 }, font: { color: defaultFontColor } });
        });
        edges.update(edgeUpdates);
      }

      // ---- PNG Export Feature ----
      var exportStatusTimeout = null;

      function exportPNG() {
        var originalCanvas = document.querySelector("#network canvas");
        if (!originalCanvas) {
          safeStatusText("Error: canvas not found");
          return;
        }

        safeStatusText("Exporting...");

        var exportCanvas = document.createElement("canvas");
        exportCanvas.width = originalCanvas.width;
        exportCanvas.height = originalCanvas.height;
        var ctx = exportCanvas.getContext("2d");

        // Fill white background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

        // Draw original canvas on top
        ctx.drawImage(originalCanvas, 0, 0);

        var dataURL = exportCanvas.toDataURL("image/png");

        var link = document.createElement("a");
        var now = new Date();
        var timestamp = now.toISOString().slice(0, 10) + "-" +
          String(now.getUTCHours()).padStart(2, "0") +
          String(now.getUTCMinutes()).padStart(2, "0") +
          String(now.getUTCSeconds()).padStart(2, "0");
        link.download = "wichy-graph-" + timestamp + ".png";
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        safeStatusText("Exported " + link.download, 3000);
      }

      function safeStatusText(msg, timeout) {
        clearTimeout(statusClearTimeout);
        statusEl.textContent = msg;
        if (typeof timeout === "number") {
          statusClearTimeout = setTimeout(function () {
            if (statusEl.textContent === msg) {
              statusEl.textContent = "";
            }
          }, timeout);
        }
      }
    </script>
  </body>
</html>
